<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context | Walt Rizney</title>
  <style>
    :root { --black:#000; --purple:#c084fc; --gold:#d4af37; --bright-gold:#f5d76e; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:start center;
      color:var(--purple);
      background:var(--black);
      font-family:Georgia,"Times New Roman",serif;
    }
    main { padding-top:32px; text-align:center; }
    h1 {
      margin:0;
      color:var(--bright-gold);
      font-size:clamp(2rem,10vw,4rem);
      letter-spacing:.12em;
    }
    a {
      display:inline-block;
      margin-top:28px;
      padding:8px 13px;
      border:1px solid var(--gold);
      border-radius:999px;
      color:var(--bright-gold);
      background:#160c1c;
      font-size:.78rem;
      text-decoration:none;
    }
    a:hover, a:focus-visible { color:#fff; background:#24132f; }
  </style>
</head>
<body>
  <main>
    <h1>CONTEXT</h1>
    <a href="./">← HOME</a>
    <p>this is context for my album</p>
  </main>
</body>
</html>
